[package]
name = "lantern"
version = "0.1.0"
edition = "2024"
description = "A fast Linux photo browser with big, adjustable thumbnails"
license = "MIT"
readme = "README.md"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
# Async move needs GLib 2.72; Ubuntu 24.04 ships 2.80.
gio = { version = "0.22", features = ["v2_72"] }
turbojpeg = "1.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
kamadak-exif = "0.6"
async-channel = "2"
lru = "0.18"
libc = "0.2"
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }

# `cargo deb` builds an installable package for Ubuntu / Pop!_OS.
[package.metadata.deb]
maintainer = "Logan Becket"
copyright = "2026, Logan Becket"
section = "graphics"
priority = "optional"
depends = "$auto"
extended-description = """\
Open a folder and scroll through thousands of photos, including iPhone HEIC \
files, with thumbnails as large as you like, sorted by the date they were \
taken. Nothing is indexed and nothing is cached to disk. Move photos to the \
trash, copy them to Downloads, or move and rename them."""
assets = [
    ["target/release/lantern", "usr/bin/", "755"],
    ["data/io.github.loganbecket.Lantern.desktop", "usr/share/applications/", "644"],
    ["data/io.github.loganbecket.Lantern.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/io.github.loganbecket.Lantern.metainfo.xml", "usr/share/metainfo/", "644"],
    ["README.md", "usr/share/doc/lantern/README", "644"],
]

[profile.release]
lto = "thin"
codegen-units = 1

# Decoding is the hot path; keep it fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3
